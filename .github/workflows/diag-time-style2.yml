name: diag-time-style2

on:
  push:
    paths:
      - '.github/workflows/diag-time-style2.yml'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump real anchors
        run: |
          {
            echo "=== 1208-1230 ==="
            sed -n '1208,1230p' index.html
            echo ""
            echo "=== 1485,1495 ==="
            sed -n '1485,1495p' index.html
            echo ""
            echo "=== 1648,1660 ==="
            sed -n '1648,1660p' index.html
            echo ""
            echo "=== 3448,3465 ==="
            sed -n '3448,3465p' index.html
            echo ""
            echo "=== card-time css 270-305 ==="
            sed -n '270,305p' index.html
          } > diag2.txt
          wc -l diag2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag2.txt
          git commit -m "chore: dump real duration-format anchors"
          git push origin HEAD:main
      - name: Cleanup
        run: |
          git rm -f diag.txt 2>/dev/null || true
          git rm .github/workflows/diag-time-style2.yml
          git commit -m "chore: cleanup diag files"
          git push origin HEAD:main
