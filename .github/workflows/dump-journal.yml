name: dump-journal

on:
  push:
    paths:
      - '.github/workflows/dump-journal.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump render and css
        run: |
          {
            echo "=== render 2410-2470 ==="
            sed -n '2410,2470p' index.html
            echo ""
            echo "=== formatStartTime ==="
            awk '/function formatStartTime/,/^  \}$/' index.html
            echo ""
            echo "=== #list css ==="
            grep -n -A 10 "^  #list {" index.html
            echo ""
            echo "=== .card css ==="
            grep -n -A 14 "^  \.card {" index.html
            echo ""
            echo "=== card-time css ==="
            sed -n '276,300p' index.html
          } > dump7.txt
          wc -l dump7.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dump7.txt
          git commit -m "chore: dump render and css for journal style"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/dump-journal.yml
          git commit -m "chore: remove dump7 workflow"
          git push origin HEAD:main
