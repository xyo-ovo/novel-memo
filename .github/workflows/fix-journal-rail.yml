name: fix-journal-rail

on:
  push:
    paths:
      - '.github/workflows/fix-journal-rail.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rail right next to date, year spacing
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          reps = [
            ("  :root[data-time-style=\"journal\"] .tl-row {\n    position: relative;\n    padding-left: 82px;\n  }\n",
             "  :root[data-time-style=\"journal\"] .tl-row {\n    position: relative;\n    padding-left: 76px;\n  }\n"),

            ("    left: 60px;\n    top: 8px;\n    bottom: -12px;\n    width: 1px;\n    background: var(--line);\n",
             "    left: 54px;\n    top: 6px;\n    bottom: -12px;\n    width: 1px;\n    background: var(--line);\n"),

            ("  :root[data-time-style=\"journal\"] .tl-side {\n    position: absolute;\n    left: 2px;\n    top: 12px;\n    width: 50px;\n    display: flex;\n    flex-direction: column;\n    align-items: flex-start;\n    line-height: 1;\n  }\n",
             "  :root[data-time-style=\"journal\"] .tl-side {\n    position: absolute;\n    left: 0;\n    top: 12px;\n    width: 50px;\n    display: flex;\n    flex-direction: column;\n    align-items: flex-end;\n    line-height: 1;\n  }\n"),

            ("    letter-spacing: 3.5px;\n    color: var(--text-dim);\n    margin-bottom: 6px;\n",
             "    letter-spacing: 1.5px;\n    color: var(--text-dim);\n    margin-bottom: 5px;\n"),

            ("    margin: -14px 0 10px;\n    padding: 17px 0 11px;\n",
             "    margin: -14px 0 14px;\n    padding: 17px 0 11px;\n"),
          ]

          bad = False
          for i, (old, new) in enumerate(reps, 1):
              c = s.count(old)
              print('rep%d count=%d want=1' % (i, c))
              if c != 1:
                  bad = True
          if bad:
              sys.exit(1)

          for old, new in reps:
              s = s.replace(old, new)

          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "style: rail hugs the date, more room under year"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/fix-journal-rail.yml
          git commit -m "chore: remove fix-journal-rail workflow"
          git push origin HEAD:main
