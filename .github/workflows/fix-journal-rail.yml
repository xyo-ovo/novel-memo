name: fix-journal-rail

on:
  push:
    paths:
      - '.github/workflows/fix-journal-rail.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rail starts below the date
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          old = "  /* 手账样式：左栏月/日 + 竖线 */\n  :root[data-time-style=\"journal\"] .tl-row {\n    position: relative;\n    padding-left: 82px;\n  }\n  :root[data-time-style=\"journal\"] .tl-row::before {\n    content: '';\n    position: absolute;\n    left: 60px;\n    top: 8px;\n    bottom: -12px;\n    width: 1px;\n    background: var(--line);\n  }\n  :root[data-time-style=\"journal\"] .tl-side {\n    position: absolute;\n    left: 2px;\n    top: 12px;\n    width: 50px;\n    display: flex;\n    flex-direction: column;\n    align-items: flex-start;\n    line-height: 1;\n  }\n  :root[data-time-style=\"journal\"] .tl-month {\n    font-size: 10px;\n    font-weight: 700;\n    letter-spacing: 3.5px;\n    color: var(--text-dim);\n    margin-bottom: 6px;\n  }\n  :root[data-time-style=\"journal\"] .tl-day {\n    font-family: Georgia, \"Times New Roman\", serif;\n    font-size: 31px;\n    font-weight: 700;\n    letter-spacing: -1.5px;\n    color: var(--accent);\n    line-height: .9;\n  }\n  :root[data-time-style=\"journal\"] .tl-side::after {\n    content: '';\n    width: 22px;\n    height: 2px;\n    margin-top: 9px;\n    border-radius: 1px;\n    background: var(--accent);\n    opacity: .3;\n  }\n"

          new = "  /* 手账样式：日期在上，竖线从日期下方延伸，卡片挂右侧 */\n  :root[data-time-style=\"journal\"] .tl-row {\n    position: relative;\n  }\n  :root[data-time-style=\"journal\"] .tl-row::before {\n    content: '';\n    position: absolute;\n    left: 3px;\n    top: 38px;\n    bottom: 0;\n    width: 1px;\n    background: var(--line);\n  }\n  :root[data-time-style=\"journal\"] .tl-side {\n    display: flex;\n    align-items: baseline;\n    gap: 6px;\n    margin: 0 0 10px;\n    padding-left: 1px;\n    line-height: 1;\n  }\n  :root[data-time-style=\"journal\"] .tl-month {\n    font-size: 10px;\n    font-weight: 700;\n    letter-spacing: 2.5px;\n    color: var(--text-dim);\n  }\n  :root[data-time-style=\"journal\"] .tl-day {\n    font-family: Georgia, \"Times New Roman\", serif;\n    font-size: 23px;\n    font-weight: 700;\n    letter-spacing: -.5px;\n    color: var(--accent);\n    line-height: 1;\n  }\n  :root[data-time-style=\"journal\"] .tl-row .card {\n    margin-left: 24px;\n  }\n"

          c = s.count(old)
          print('count=%d want=1' % c)
          if c != 1:
              sys.exit(1)

          s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: journal rail starts below the date, card hangs to its right"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/fix-journal-rail.yml
          git commit -m "chore: remove fix-journal-rail workflow"
          git push origin HEAD:main
