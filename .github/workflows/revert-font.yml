name: revert-font

on:
  push:
    paths:
      - '.github/workflows/revert-font.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revert font reference
        run: |
          sed -i "s|url('font-subset.woff2') format('woff2')|url('font.ttf') format('truetype')|" index.html
          grep -c "font.ttf" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "revert: use original font.ttf again"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/revert-font.yml
          git commit -m "chore: remove revert workflow"
          git push origin HEAD:main
