name: fix-cover-flash

on:
  push:
    paths:
      - '.github/workflows/fix-cover-flash.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for covers before first render
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          old = "  renderRestoreModePicker();\n  render();\n\n  // 老封面从 localStorage 搬到 IndexedDB，然后把封面 URL 都备好再刷一次列表\n  migrateThemeCovers().then(() => loadAllCovers()).then(() => render()).catch(() => {});\n"

          new = "  renderRestoreModePicker();\n\n  // 老封面从 localStorage 搬到 IndexedDB，封面 URL 都备好后再首次渲染，\n  // 避免「先无封面、后有封面」的跳变\n  migrateThemeCovers().then(() => loadAllCovers()).then(() => render()).catch(() => render());\n"

          c = s.count(old)
          print('count=%d want=1' % c)
          if c != 1:
              sys.exit(1)

          s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: wait for cover cache before first render"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/fix-cover-flash.yml
          git commit -m "chore: remove cover flash fix workflow"
          git push origin HEAD:main
