name: fix-journal-3

on:
  push:
    paths:
      - '.github/workflows/fix-journal-3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix journal style (load / sticky year / card width)
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)
          reps = []

          # 1) 刷新失效的根因：loadSettings 里漏了 dataset.timeStyle
          reps.append((
              "    const tSel = document.getElementById('set-time-style');\n    if (tSel) tSel.value = settings.timeStyle || 'marker';\n    const gToken = document.getElementById('gist-token');\n",
              "    const tSel = document.getElementById('set-time-style');\n    if (tSel) tSel.value = settings.timeStyle || 'marker';\n    document.documentElement.dataset.timeStyle = settings.timeStyle || 'marker';\n    const gToken = document.getElementById('gist-token');\n",
              1
          ))

          # 2) 年份贴顶 + 卡片不再被挤压
          reps.append((
              "  :root[data-time-style=\"journal\"] .tl-row {\n    position: relative;\n    padding-left: 22px;\n    padding-bottom: 14px;\n  }\n",
              "  :root[data-time-style=\"journal\"] #list {\n    padding-top: 0;\n  }\n  :root[data-time-style=\"journal\"] .tl-row {\n    position: relative;\n    margin-left: -16px;\n    padding-left: 16px;\n    padding-bottom: 12px;\n  }\n",
              1
          ))

          # 3) 日期跟着左移回竖线
          reps.append((
              "    margin: 0 0 10px -22px;\n    line-height: 1;\n",
              "    margin: 0 0 10px -16px;\n    padding-left: 2px;\n    line-height: 1;\n",
              1
          ))

          # 4) 年份不再用负 margin（改成 #list padding-top:0）
          reps.append((
              "    margin: -14px 0 14px;\n    padding: 17px 0 11px;\n",
              "    margin: 0 0 12px;\n    padding: 16px 0 10px;\n",
              1
          ))

          bad = False
          for i, (old, new, exp) in enumerate(reps, 1):
              c = s.count(old)
              print('rep%d count=%d want=%d' % (i, c, exp))
              if c != exp:
                  bad = True
          if bad:
              sys.exit(1)

          for old, new, exp in reps:
              s = s.replace(old, new)

          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: journal style applies on load, year sticks to top, cards keep full width"
          git push origin HEAD:main
      - name: Cleanup
        run: |
          git rm -f j.txt 2>/dev/null || true
          git rm .github/workflows/fix-journal-3.yml
          git commit -m "chore: cleanup dump and fix-journal workflow"
          git push origin HEAD:main
