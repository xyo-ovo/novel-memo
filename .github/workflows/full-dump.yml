name: full-dump

on:
  push:
    paths:
      - '.github/workflows/full-dump.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full dump of list structure
        run: |
          {
            echo "########## 1. HTML: #list 及其父容器 ##########"
            grep -n -B 30 '<div id="list"' index.html | tail -40
            echo ""
            echo "########## 2. CSS: #list / .tl-* / .card / .card-time 全部 ##########"
            awk 'NR>=240 && NR<=340 {printf "%d| %s\n", NR, $0}' index.html
            echo ""
            echo "########## 3. CSS: journal 全部规则 ##########"
            grep -n 'data-time-style' index.html
            echo ""
            echo "########## 4. JS: render 里生成卡片结构（2455-2500） ##########"
            awk 'NR>=2455 && NR<=2500 {printf "%d| %s\n", NR, $0}' index.html
            echo ""
            echo "########## 5. JS: render 里 tl-row 生成（2400-2460） ##########"
            awk 'NR>=2400 && NR<=2460 {printf "%d| %s\n", NR, $0}' index.html
            echo ""
            echo "########## 6. JS: 列表入场动画处理 ##########"
            grep -n -A 25 '依次错开浮现' index.html
          } > fulldump.txt
          wc -l fulldump.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fulldump.txt
          git commit -m "chore: full dump of list structure"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/full-dump.yml
          git commit -m "chore: remove full-dump workflow"
          git push origin HEAD:main
