name: one-shot-search-sheet-patch

on:
  push:
    paths:
      - '.github/workflows/one-shot-search-sheet-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix wishlist search and dialog blur
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          reps = [
              ("    if (currentFilter === 'all') {\n      shown = shown.filter(r => r.status !== 'wishlist');\n    } else {\n      shown = shown.filter(r => r.status === currentFilter);\n    }\n    if (searchQuery.trim()) {\n      const q = searchQuery.trim().toLowerCase();\n      shown = shown.filter(r =>\n        (r.title || '').toLowerCase().includes(q) ||\n        (r.author || '').toLowerCase().includes(q) ||\n        (r.genre || '').toLowerCase().includes(q)\n      );\n    }\n",
               "    if (searchQuery.trim()) {\n      const q = searchQuery.trim().toLowerCase();\n      shown = shown.filter(r =>\n        (r.title || '').toLowerCase().includes(q) ||\n        (r.author || '').toLowerCase().includes(q) ||\n        (r.genre || '').toLowerCase().includes(q)\n      );\n    } else if (currentFilter === 'all') {\n      shown = shown.filter(r => r.status !== 'wishlist');\n    } else {\n      shown = shown.filter(r => r.status === currentFilter);\n    }\n"),

              ("    background: var(--sheet-glass);\n    -webkit-backdrop-filter: blur(16px);\n    backdrop-filter: blur(16px);\n    border: 1px solid var(--card-border);\n",
               "    background: var(--sheet-glass);\n    border: 1px solid var(--card-border);\n"),
          ]

          bad = False
          for old, new in reps:
              c = s.count(old)
              print('count=%d for %r' % (c, old[:60]))
              if c != 1:
                  bad = True
          if bad:
              sys.exit(1)

          for old, new in reps:
              s = s.replace(old, new)

          io.open(p, 'w', encoding='utf-8').write(s)
          print('OK: %d -> %d bytes, blur left = %d' % (n, len(s), s.count('backdrop-filter')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: search includes wishlist; remove dialog backdrop blur"
          git push origin HEAD:main
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-search-sheet-patch.yml
          git commit -m "chore: remove one-shot search/sheet workflow"
          git push origin HEAD:main
