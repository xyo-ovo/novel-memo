name: dump-format-code

on:
  push:
    paths:
      - '.github/workflows/dump-format-code.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump backup format code
        run: |
          {
            echo "=== buildBackup ==="
            awk '/function buildBackup/,/^  \}$/' index.html
            echo ""
            echo "=== extractBackup ==="
            awk '/function extractBackup/,/^  \}$/' index.html
            echo ""
            echo "=== BACKUP consts ==="
            grep -n "BACKUP_REPO_OWNER\|BACKUP_REPO_DEFAULT\|BACKUP_FILE_PATH\|BACKUP_VERSION" index.html | head -20
          } > dump2.txt
          wc -l dump2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dump2.txt
          git commit -m "chore: dump backup format code"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/dump-format-code.yml
          git commit -m "chore: remove dump2 workflow"
          git push origin HEAD:main
