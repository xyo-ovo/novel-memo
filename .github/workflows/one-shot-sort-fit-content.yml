name: one-shot-sort-fit-content

on:
  push:
    paths:
      - '.github/workflows/one-shot-sort-fit-content.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sort menu sized to content
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          reps = [
              ("    width: min(90vw, 360px);\n",
               "    width: max-content;\n    max-width: min(92vw, 420px);\n", 1),

              ("    grid-template-columns: 1fr 1fr;\n",
               "    grid-template-columns: max-content max-content;\n", 1),
          ]

          bad = False
          for i, (old, new, exp) in enumerate(reps, 1):
              c = s.count(old)
              print('rep%d count=%d want=%d' % (i, c, exp))
              if c != exp:
                  bad = True
          if bad:
              sys.exit(1)

          for old, new, exp in reps:
              s = s.replace(old, new)

          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "style: sort menu shrinks to content width"
          git push origin HEAD:main
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-sort-fit-content.yml
          git commit -m "chore: remove one-shot sort fit-content workflow"
          git push origin HEAD:main
