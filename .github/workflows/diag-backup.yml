name: diag-backup

on:
  push:
    paths:
      - '.github/workflows/diag-backup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add diagnostics to restore error
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          old = "        const bk = extractBackup(raw);\n        if (!bk) throw new Error('备份格式不对');\n"
          new = "        const bk = extractBackup(raw);\n        if (!bk) throw new Error('备份格式不对（拿到 ' + content.length + ' 字符，开头：' + content.slice(0, 100).replace(/\\s+/g, ' ') + '）');\n"

          c = s.count(old)
          print('count=%d want=1' % c)
          if c != 1:
              sys.exit(1)

          s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: add diagnostics to backup format error"
          git push origin HEAD:main
      - name: Cleanup
        run: |
          git rm -f dump2.txt 2>/dev/null || true
          git rm .github/workflows/diag-backup.yml
          git commit -m "chore: cleanup dump2 and diag workflow"
          git push origin HEAD:main
