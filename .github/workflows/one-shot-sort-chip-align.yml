name: one-shot-sort-chip-align

on:
  push:
    paths:
      - '.github/workflows/one-shot-sort-chip-align.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sort chip align start
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          old = "  .sort-menu button {\n    display: block;\n    width: fit-content;\n"
          new = "  .sort-menu button {\n    display: block;\n    width: fit-content;\n    justify-self: start;\n"

          c = s.count(old)
          print('count=%d want=1' % c)
          if c != 1:
              sys.exit(1)

          s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "style: sort chips align start so background hugs text"
          git push origin HEAD:main
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-sort-chip-align.yml
          git commit -m "chore: remove one-shot sort chip align workflow"
          git push origin HEAD:main
