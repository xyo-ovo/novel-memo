name: add-themes

on:
  push:
    paths:
      - '.github/workflows/add-themes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add three color themes
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)
          lines = s.split('\n')

          mocha = "    mocha: { bg:'#f9f5f0', card:'#ffffff', 'card-glass':'rgba(255,255,255,.52)', 'card-border':'rgba(255,255,255,.62)', 'card-press':'rgba(255,255,255,.72)', 'glass-active':'rgba(255,255,255,.78)', 'glass-highlight':'rgba(255,255,255,.85)', 'sheet-bg':'#ffffff', 'sheet-glass':'rgba(255,255,255,.97)', 'field-bg':'#fafbfc', 'btn-soft-bg':'#ffffff', 'scroll-thumb':'rgba(150,138,126,.55)', 'accent-glass':'rgba(166,128,92,.13)', 'green-glass':'rgba(74,158,123,.16)', 'blue-glass':'rgba(74,130,190,.14)', 'orange-glass':'rgba(201,122,53,.15)', 'wishlist-glass':'rgba(150,138,126,.16)', glow1:'rgba(166,128,92,.12)', glow2:'rgba(201,169,110,.10)', text:'#332c25', 'text-sub':'#6f6459', 'text-dim':'#9d9288', line:'#ebe2d8', accent:'#a6805c', 'accent-strong':'#8d6a4a', 'accent-soft':'#f5ede4', blue:'#4a82be', 'blue-soft':'#eaf1f8', green:'#4a9e7b', 'green-soft':'#e9f3ee', red:'#be6e6e', 'red-soft':'#f8eaea', orange:'#c97a35', 'orange-soft':'#fbeee1', gold:'#c99a3b' },"
          ink = "    ink: { bg:'#f3f5f8', card:'#ffffff', 'card-glass':'rgba(255,255,255,.52)', 'card-border':'rgba(255,255,255,.62)', 'card-press':'rgba(255,255,255,.72)', 'glass-active':'rgba(255,255,255,.78)', 'glass-highlight':'rgba(255,255,255,.85)', 'sheet-bg':'#ffffff', 'sheet-glass':'rgba(255,255,255,.97)', 'field-bg':'#fafbfc', 'btn-soft-bg':'#ffffff', 'scroll-thumb':'rgba(133,146,160,.55)', 'accent-glass':'rgba(69,96,128,.13)', 'green-glass':'rgba(74,158,123,.16)', 'blue-glass':'rgba(74,130,190,.14)', 'orange-glass':'rgba(201,122,53,.15)', 'wishlist-glass':'rgba(133,146,160,.16)', glow1:'rgba(69,96,128,.13)', glow2:'rgba(90,120,170,.10)', text:'#232c38', 'text-sub':'#5b6673', 'text-dim':'#8794a3', line:'#e2e7ee', accent:'#456080', 'accent-strong':'#374d68', 'accent-soft':'#e9eef4', blue:'#4a82be', 'blue-soft':'#eaf1f8', green:'#4a9e7b', 'green-soft':'#e9f3ee', red:'#be6e6e', 'red-soft':'#f8eaea', orange:'#c97a35', 'orange-soft':'#fbeee1', gold:'#c99a3b' },"
          matcha = "    matcha: { bg:'#f6f8f2', card:'#ffffff', 'card-glass':'rgba(255,255,255,.52)', 'card-border':'rgba(255,255,255,.62)', 'card-press':'rgba(255,255,255,.72)', 'glass-active':'rgba(255,255,255,.78)', 'glass-highlight':'rgba(255,255,255,.85)', 'sheet-bg':'#ffffff', 'sheet-glass':'rgba(255,255,255,.97)', 'field-bg':'#fafbfc', 'btn-soft-bg':'#ffffff', 'scroll-thumb':'rgba(140,150,128,.55)', 'accent-glass':'rgba(107,139,82,.13)', 'green-glass':'rgba(74,158,123,.16)', 'blue-glass':'rgba(74,130,190,.14)', 'orange-glass':'rgba(201,122,53,.15)', 'wishlist-glass':'rgba(140,150,128,.16)', glow1:'rgba(107,139,82,.12)', glow2:'rgba(180,200,120,.10)', text:'#2b3325', 'text-sub':'#616b56', 'text-dim':'#929c86', line:'#e6ecdd', accent:'#6b8b52', 'accent-strong':'#57713f', 'accent-soft':'#eef3e7', blue:'#4a82be', 'blue-soft':'#eaf1f8', green:'#4a9e7b', 'green-soft':'#e9f3ee', red:'#be6e6e', 'red-soft':'#f8eaea', orange:'#c97a35', 'orange-soft':'#fbeee1', gold:'#c99a3b' }"

          btn_mocha = '        <button class="color-swatch" data-color-theme="mocha" title="奶茶"><span class="dot" style="background:#a6805c"></span>奶茶</button>'
          btn_ink = '        <button class="color-swatch" data-color-theme="ink" title="墨蓝"><span class="dot" style="background:#456080"></span>墨蓝</button>'
          btn_matcha = '        <button class="color-swatch" data-color-theme="matcha" title="抹茶"><span class="dot" style="background:#6b8b52"></span>抹茶</button>'

          theme_idx = -1
          for i, l in enumerate(lines):
              if l.startswith('    night: {'):
                  theme_idx = i
                  break
          if theme_idx < 0:
              print('ERR: night theme line not found')
              sys.exit(1)
          lines[theme_idx] = lines[theme_idx] + ','
          lines.insert(theme_idx + 1, mocha)
          lines.insert(theme_idx + 2, ink)
          lines.insert(theme_idx + 3, matcha)

          btn_idx = -1
          for i, l in enumerate(lines):
              if 'data-color-theme="night"' in l:
                  btn_idx = i
                  break
          if btn_idx < 0:
              print('ERR: night button line not found')
              sys.exit(1)
          lines.insert(btn_idx + 1, btn_mocha)
          lines.insert(btn_idx + 2, btn_ink)
          lines.insert(btn_idx + 3, btn_matcha)

          s = '\n'.join(lines)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes, themes=%d' % (n, len(s), s.count('data-color-theme=')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: add mocha / ink / matcha color themes"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/add-themes.yml
          git commit -m "chore: remove add-themes workflow"
          git push origin HEAD:main
