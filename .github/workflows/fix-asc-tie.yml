name: fix-asc-tie

on:
  push:
    paths:
      - '.github/workflows/fix-asc-tie.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add tie-break to ascending sort
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          old = "  function compareByTimeAsc(a, b) {\n    const at = readSortKey(a);\n    const bt = readSortKey(b);\n    if (at === bt) return 0;\n    return at > bt ? 1 : -1;\n  }\n"

          new = "  function compareByTimeAsc(a, b) {\n    const at = readSortKey(a);\n    const bt = readSortKey(b);\n    if (at !== bt) return at > bt ? 1 : -1;\n    // 同一天时，先开始看的排前面（与降序一致）\n    const as = a.startDate ? (a.startDate + ' ' + (a.startTime || '00:00')) : (a.createdAt || '');\n    const bs = b.startDate ? (b.startDate + ' ' + (b.startTime || '00:00')) : (b.createdAt || '');\n    if (as === bs) return 0;\n    return as < bs ? -1 : 1;\n  }\n"

          c = s.count(old)
          print('count=%d want=1' % c)
          if c != 1:
              sys.exit(1)

          s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: apply start-date tie-break to ascending sort too"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/fix-asc-tie.yml
          git commit -m "chore: remove fix-asc-tie workflow"
          git push origin HEAD:main
