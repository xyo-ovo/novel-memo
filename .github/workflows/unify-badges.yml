name: unify-badges

on:
  push:
    paths:
      - '.github/workflows/unify-badges.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify badge backgrounds
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          old = "  .badge-finished { background: var(--green-glass);    color: var(--green); }\n  .badge-reading  { background: var(--blue-glass);     color: var(--blue); }\n  .badge-dropped  { background: var(--orange-glass);   color: var(--orange); }\n  .badge-wishlist { background: var(--wishlist-glass); color: var(--text-sub); }\n"

          new = "  .badge-finished { background: var(--wishlist-glass); color: var(--green); }\n  .badge-reading  { background: var(--wishlist-glass); color: var(--blue); }\n  .badge-dropped  { background: var(--wishlist-glass); color: var(--orange); }\n  .badge-wishlist { background: var(--wishlist-glass); color: var(--text-sub); }\n"

          c = s.count(old)
          print('count=%d want=1' % c)
          if c != 1:
              sys.exit(1)

          s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "style: unify status badge backgrounds"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/unify-badges.yml
          git commit -m "chore: remove badge workflow"
          git push origin HEAD:main
