name: one-shot-sort-sheet-patch

on:
  push:
    paths:
      - '.github/workflows/one-shot-sort-sheet-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sort options and opacity patch
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          reps = [
              ("    --sheet-glass: rgba(255,255,255,.86);\n",
               "    --sheet-glass: rgba(255,255,255,.97);\n", 1),

              ("'sheet-glass':'rgba(255,255,255,.86)'",
               "'sheet-glass':'rgba(255,255,255,.97)'", 4),

              ("'sheet-glass':'rgba(38,45,52,.86)'",
               "'sheet-glass':'rgba(38,45,52,.97)'", 1),

              ("  .sort-menu {\n    position: absolute;\n    right: 0;\n    top: calc(100% + 6px);\n    min-width: 190px;\n    background: var(--card-glass);\n",
               "  .sort-menu {\n    position: absolute;\n    right: 0;\n    top: calc(100% + 6px);\n    min-width: 190px;\n    background: var(--sheet-glass);\n", 1),

              ("  const SORT_OPTIONS = [\n    ['recent', '阅读时间 · 新→旧'],\n    ['title', '书名 · A→Z'],\n    ['hours', '阅读时长 · 长→短'],\n    ['rating', '评分 · 高→低'],\n    ['words', '字数 · 多→少']\n  ];\n",
               "  const SORT_OPTIONS = [\n    ['recent', '阅读时间 · 新→旧'],\n    ['recent_asc', '阅读时间 · 旧→新'],\n    ['title', '书名 · A→Z'],\n    ['title_desc', '书名 · Z→A'],\n    ['hours', '阅读时长 · 长→短'],\n    ['hours_asc', '阅读时长 · 短→长'],\n    ['words', '字数 · 多→少'],\n    ['words_asc', '字数 · 少→多']\n  ];\n", 1),

              ("  // 新的排前面\n  function compareByTimeDesc(a, b) {\n    const at = readSortKey(a);\n    const bt = readSortKey(b);\n    if (at === bt) return 0;\n    return at > bt ? -1 : 1;\n  }\n",
               "  // 新的排前面\n  function compareByTimeDesc(a, b) {\n    const at = readSortKey(a);\n    const bt = readSortKey(b);\n    if (at === bt) return 0;\n    return at > bt ? -1 : 1;\n  }\n\n  // 旧的排前面\n  function compareByTimeAsc(a, b) {\n    const at = readSortKey(a);\n    const bt = readSortKey(b);\n    if (at === bt) return 0;\n    return at > bt ? 1 : -1;\n  }\n", 1),

              ("    } else if (sortMode === 'rating') {\n      sorted.sort((a, b) => {\n        const c = (b.rating || 0) - (a.rating || 0);\n        return c !== 0 ? c : compareByTimeDesc(a, b);\n      });\n    } else if (sortMode === 'words') {\n",
               "    } else if (sortMode === 'words') {\n", 1),

              ("    if (sortMode === 'title') {\n      sorted.sort((a, b) => {\n        const c = (a.title || '').localeCompare(b.title || '', 'zh-Hans-CN', { numeric: true });\n        return c !== 0 ? c : compareByTimeDesc(a, b);\n      });\n",
               "    if (sortMode === 'title') {\n      sorted.sort((a, b) => {\n        const c = (a.title || '').localeCompare(b.title || '', 'zh-Hans-CN', { numeric: true });\n        return c !== 0 ? c : compareByTimeDesc(a, b);\n      });\n    } else if (sortMode === 'title_desc') {\n      sorted.sort((a, b) => {\n        const c = (b.title || '').localeCompare(a.title || '', 'zh-Hans-CN', { numeric: true });\n        return c !== 0 ? c : compareByTimeDesc(a, b);\n      });\n", 1),

              ("    } else if (sortMode === 'hours') {\n      sorted.sort((a, b) => {\n        const c = (b.readingHours ?? -1) - (a.readingHours ?? -1);\n        return c !== 0 ? c : compareByTimeDesc(a, b);\n      });\n",
               "    } else if (sortMode === 'hours') {\n      sorted.sort((a, b) => {\n        const c = (b.readingHours ?? -1) - (a.readingHours ?? -1);\n        return c !== 0 ? c : compareByTimeDesc(a, b);\n      });\n    } else if (sortMode === 'hours_asc') {\n      sorted.sort((a, b) => {\n        const c = (a.readingHours ?? -1) - (b.readingHours ?? -1);\n        return c !== 0 ? c : compareByTimeDesc(a, b);\n      });\n", 1),

              ("    } else if (sortMode === 'words') {\n      sorted.sort((a, b) => {\n        const c = (b.wordCount ?? -1) - (a.wordCount ?? -1);\n        return c !== 0 ? c : compareByTimeDesc(a, b);\n      });\n    } else {\n      sorted.sort(compareByTimeDesc);\n    }\n",
               "    } else if (sortMode === 'words') {\n      sorted.sort((a, b) => {\n        const c = (b.wordCount ?? -1) - (a.wordCount ?? -1);\n        return c !== 0 ? c : compareByTimeDesc(a, b);\n      });\n    } else if (sortMode === 'words_asc') {\n      sorted.sort((a, b) => {\n        const c = (a.wordCount ?? -1) - (b.wordCount ?? -1);\n        return c !== 0 ? c : compareByTimeDesc(a, b);\n      });\n    } else if (sortMode === 'recent_asc') {\n      sorted.sort(compareByTimeAsc);\n    } else {\n      sorted.sort(compareByTimeDesc);\n    }\n", 1),
          ]

          bad = False
          for i, (old, new, exp) in enumerate(reps, 1):
              c = s.count(old)
              print('rep%d count=%d want=%d %s' % (i, c, exp, 'OK' if c == exp else 'FAIL'))
              if c != exp:
                  bad = True
          if bad:
              sys.exit(1)

          for old, new, exp in reps:
              s = s.replace(old, new)

          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: sort both directions, drop rating; solidify dialog and sort menu"
          git push origin HEAD:main
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-sort-sheet-patch.yml
          git commit -m "chore: remove one-shot sort/sheet workflow"
          git push origin HEAD:main
