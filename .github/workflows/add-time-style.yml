name: add-time-style

on:
  push:
    paths:
      - '.github/workflows/add-time-style.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add date style option
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)
          reps = []

          # 1) HTML：在「阅读时长格式」后加「日期样式」
          reps.append((
            "        <div class=\"hint\">卡片上如何显示阅读时长</div>\n      </div>\n",
            "        <div class=\"hint\">卡片上如何显示阅读时长</div>\n      </div>\n\n      <div class=\"field\">\n        <label>日期样式</label>\n        <select id=\"time-style\">\n          <option value=\"marker\">分组标记（小竖条）</option>\n          <option value=\"timeline\">时间线（圆点 + 横线）</option>\n        </select>\n        <div class=\"hint\">卡片上方那行日期的显示方式</div>\n      </div>\n",
            1
          ))

          # 2) CSS：加时间线样式
          reps.append((
            "  .card-time::before {\n    content: '';\n    position: absolute;\n    left: 0;\n    top: 50%;\n    transform: translateY(-50%);\n    width: 3px;\n    height: 11px;\n    border-radius: 2px;\n    background: var(--accent);\n    opacity: .5;\n  }\n",
            "  .card-time::before {\n    content: '';\n    position: absolute;\n    left: 0;\n    top: 50%;\n    transform: translateY(-50%);\n    width: 3px;\n    height: 11px;\n    border-radius: 2px;\n    background: var(--accent);\n    opacity: .5;\n  }\n  :root[data-time-style=\"timeline\"] .card-time {\n    display: flex;\n    align-items: center;\n    gap: 8px;\n    padding-left: 0;\n  }\n  :root[data-time-style=\"timeline\"] .card-time::before {\n    position: static;\n    transform: none;\n    width: 7px;\n    height: 7px;\n    border-radius: 50%;\n    opacity: .75;\n  }\n  :root[data-time-style=\"timeline\"] .card-time::after {\n    content: '';\n    flex: 1;\n    height: 1px;\n    background: var(--line);\n  }\n",
            1
          ))

          # 3) JS：声明 $timeStyle
          reps.append((
            "  const $durationFormat = document.getElementById('duration-format');\n",
            "  const $durationFormat = document.getElementById('duration-format');\n  const $timeStyle = document.getElementById('time-style');\n",
            1
          ))

          # 4) settings 默认值（两处）
          reps.append((
            "durationFormat: 'cn',",
            "durationFormat: 'cn', timeStyle: 'marker',",
            2
          ))

          # 5) 初始化时应用
          reps.append((
            "    $durationFormat.value = settings.durationFormat;\n",
            "    $durationFormat.value = settings.durationFormat;\n    if ($timeStyle) $timeStyle.value = settings.timeStyle || 'marker';\n    document.documentElement.dataset.timeStyle = settings.timeStyle || 'marker';\n",
            1
          ))

          # 6) change 绑定
          reps.append((
            "  $durationFormat.addEventListener('change', () => {\n    settings.durationFormat = $durationFormat.value;\n    saveSettings();\n    render();\n  });\n",
            "  $durationFormat.addEventListener('change', () => {\n    settings.durationFormat = $durationFormat.value;\n    saveSettings();\n    render();\n  });\n\n  $timeStyle.addEventListener('change', () => {\n    settings.timeStyle = $timeStyle.value;\n    document.documentElement.dataset.timeStyle = settings.timeStyle;\n    saveSettings();\n    render();\n  });\n",
            1
          ))

          bad = False
          for i, (old, new, exp) in enumerate(reps, 1):
              c = s.count(old)
              print('rep%d count=%d want=%d' % (i, c, exp))
              if c != exp:
                  bad = True
          if bad:
              sys.exit(1)

          for old, new, exp in reps:
              s = s.replace(old, new)

          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: add date style option (marker / timeline)"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/add-time-style.yml
          git commit -m "chore: remove add-time-style workflow"
          git push origin HEAD:main
