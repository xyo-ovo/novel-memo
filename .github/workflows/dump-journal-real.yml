name: dump-journal-real

on:
  push:
    paths:
      - '.github/workflows/dump-journal-real.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump real journal css and loadSettings
        run: |
          {
            echo "===== journal 全部规则 ====="
            awk '/data-time-style="journal"/{f=1} f{print NR": "$0} /^  \.card \{/{f=0}' index.html | head -70
            echo ""
            echo "===== set-time-style 出现处 ====="
            grep -n -B 3 -A 3 "set-time-style" index.html
            echo ""
            echo "===== #list css ====="
            grep -n -A 7 "^  #list {" index.html
          } > j.txt
          wc -l j.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add j.txt
          git commit -m "chore: dump real journal css"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/dump-journal-real.yml
          git commit -m "chore: remove dump workflow"
          git push origin HEAD:main
