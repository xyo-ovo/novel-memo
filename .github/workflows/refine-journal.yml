name: refine-journal

on:
  push:
    paths:
      - '.github/workflows/refine-journal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine journal style
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          old = "  /* 手账样式：左栏月/日 + 竖线 */\n  :root[data-time-style=\"journal\"] .tl-row {\n    position: relative;\n    padding-left: 68px;\n  }\n  :root[data-time-style=\"journal\"] .tl-row::before {\n    content: '';\n    position: absolute;\n    left: 56px;\n    top: 2px;\n    bottom: -12px;\n    width: 1px;\n    background: var(--line);\n  }\n  :root[data-time-style=\"journal\"] .tl-side {\n    position: absolute;\n    left: 0;\n    top: 12px;\n    width: 46px;\n    display: flex;\n    flex-direction: column;\n    align-items: flex-end;\n    line-height: 1;\n  }\n  :root[data-time-style=\"journal\"] .tl-month {\n    font-size: 11px;\n    color: var(--text-dim);\n    letter-spacing: .5px;\n    margin-bottom: 4px;\n  }\n  :root[data-time-style=\"journal\"] .tl-day {\n    font-family: Georgia, \"Times New Roman\", serif;\n    font-size: 24px;\n    font-weight: 700;\n    color: var(--accent);\n  }\n  :root[data-time-style=\"journal\"] .tl-year {\n    position: sticky;\n    top: 0;\n    z-index: 6;\n    margin: 0 0 6px;\n    padding: 10px 0 8px;\n    font-family: Georgia, \"Times New Roman\", serif;\n    font-size: 13px;\n    letter-spacing: 3px;\n    color: var(--text-dim);\n    background: var(--bg);\n    border-bottom: 1px solid var(--line);\n  }\n"

          new = "  /* 手账样式：左栏月/日 + 竖线 */\n  :root[data-time-style=\"journal\"] .tl-row {\n    position: relative;\n    padding-left: 82px;\n  }\n  :root[data-time-style=\"journal\"] .tl-row::before {\n    content: '';\n    position: absolute;\n    left: 60px;\n    top: 8px;\n    bottom: -12px;\n    width: 1px;\n    background: var(--line);\n  }\n  :root[data-time-style=\"journal\"] .tl-side {\n    position: absolute;\n    left: 2px;\n    top: 12px;\n    width: 50px;\n    display: flex;\n    flex-direction: column;\n    align-items: flex-start;\n    line-height: 1;\n  }\n  :root[data-time-style=\"journal\"] .tl-month {\n    font-size: 10px;\n    font-weight: 700;\n    letter-spacing: 3.5px;\n    color: var(--text-dim);\n    margin-bottom: 6px;\n  }\n  :root[data-time-style=\"journal\"] .tl-day {\n    font-family: Georgia, \"Times New Roman\", serif;\n    font-size: 31px;\n    font-weight: 700;\n    letter-spacing: -1.5px;\n    color: var(--accent);\n    line-height: .9;\n  }\n  :root[data-time-style=\"journal\"] .tl-side::after {\n    content: '';\n    width: 22px;\n    height: 2px;\n    margin-top: 9px;\n    border-radius: 1px;\n    background: var(--accent);\n    opacity: .3;\n  }\n  :root[data-time-style=\"journal\"] .tl-year {\n    position: sticky;\n    top: 0;\n    z-index: 6;\n    margin: -14px 0 10px;\n    padding: 17px 0 11px;\n    font-family: Georgia, \"Times New Roman\", serif;\n    font-size: 12px;\n    font-weight: 600;\n    letter-spacing: 5px;\n    color: var(--text-dim);\n    background: var(--bg);\n    border-bottom: 1px solid var(--line);\n  }\n"

          c = s.count(old)
          print('count=%d want=1' % c)
          if c != 1:
              sys.exit(1)

          s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "style: magazine-style journal rail, tighter sticky year"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/refine-journal.yml
          git commit -m "chore: remove refine-journal workflow"
          git push origin HEAD:main
