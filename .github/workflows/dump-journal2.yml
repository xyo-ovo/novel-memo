name: dump-journal2

on:
  push:
    paths:
      - '.github/workflows/dump-journal2.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump render tail
        run: |
          {
            echo "=== 2465-2500 ==="
            sed -n '2465,2500p' index.html
            echo ""
            echo "=== time-style options ==="
            grep -n -A 8 'id="set-time-style"' index.html
            echo ""
            echo "=== timeStyle js ==="
            grep -n "timeStyle" index.html
          } > dump8.txt
          wc -l dump8.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dump8.txt
          git commit -m "chore: dump render tail"
          git push origin HEAD:main
      - name: Cleanup
        run: |
          git rm -f dump7.txt 2>/dev/null || true
          git rm .github/workflows/dump-journal2.yml
          git commit -m "chore: cleanup dump7 and dump8 workflow"
          git push origin HEAD:main
