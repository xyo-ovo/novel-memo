name: sort-date-only

on:
  push:
    paths:
      - '.github/workflows/sort-date-only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sort by finish date only
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          old = "  function readSortKey(r) {\n    if (r.endDate) return r.endDate + ' ' + (r.endTime || '00:00');\n    if (r.startDate) return r.startDate + ' ' + (r.startTime || '00:00');\n    if (r.wishDate) return r.wishDate + ' 00:00';\n    return r.createdAt || '';\n  }\n"

          new = "  function readSortKey(r) {\n    // 只精确到「日」：同一天读完的书，再按「开始阅读日期」分先后\n    if (r.endDate) return r.endDate;\n    if (r.startDate) return r.startDate;\n    if (r.wishDate) return r.wishDate;\n    return r.createdAt || '';\n  }\n"

          c = s.count(old)
          print('count=%d want=1' % c)
          if c != 1:
              sys.exit(1)

          s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: sort by finish date only, so same-day books order by start date"
          git push origin HEAD:main
      - name: Cleanup
        run: |
          git rm -f dump3.txt 2>/dev/null || true
          git rm .github/workflows/sort-date-only.yml
          git commit -m "chore: cleanup dump3 and sort workflow"
          git push origin HEAD:main
