name: dump-card-time

on:
  push:
    paths:
      - '.github/workflows/dump-card-time.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump card-time related code
        run: |
          {
            echo "=== grep ==="
            grep -n "card-time\|startDisplay\|cardTime" index.html
            echo ""
            echo "=== render card block (2400-2425) ==="
            sed -n '2400,2425p' index.html
            echo ""
            echo "=== .card-time css ==="
            grep -n -A 6 "^  \.card-time {" index.html
          } > dump4.txt
          wc -l dump4.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dump4.txt
          git commit -m "chore: dump card-time code"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/dump-card-time.yml
          git commit -m "chore: remove dump4 workflow"
          git push origin HEAD:main
