name: fix-tie-2

on:
  push:
    paths:
      - '.github/workflows/fix-tie-2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stronger tie-break for same finish date
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          old = "    if (at !== bt) return at > bt ? -1 : 1;\n    // 读完时间一样时，先开始看的排前面\n    const as = (a.startDate || '') + ' ' + (a.startTime || '00:00');\n    const bs = (b.startDate || '') + ' ' + (b.startTime || '00:00');\n    if (as === bs) return 0;\n    return as < bs ? -1 : 1;\n"

          new = "    if (at !== bt) return at > bt ? -1 : 1;\n    // 读完时间一样时，按「开始阅读时间」排；没填开始日期就退回「录入时间」，早的在前\n    const as = a.startDate ? (a.startDate + ' ' + (a.startTime || '00:00')) : (a.createdAt || '');\n    const bs = b.startDate ? (b.startDate + ' ' + (b.startTime || '00:00')) : (b.createdAt || '');\n    if (as === bs) return 0;\n    return as < bs ? -1 : 1;\n"

          c = s.count(old)
          print('count=%d want=1' % c)
          if c != 1:
              sys.exit(1)

          s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: fall back to createdAt when start date missing in tie-break"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/fix-tie-2.yml
          git commit -m "chore: remove fix-tie-2 workflow"
          git push origin HEAD:main
