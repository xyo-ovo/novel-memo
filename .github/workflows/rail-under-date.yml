name: rail-under-date

on:
  push:
    paths:
      - '.github/workflows/rail-under-date.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rail starts under the date
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          old = "  /* 手账样式：左栏月/日 + 竖线 */\n  :root[data-time-style=\"journal\"] .tl-row {\n    position: relative;\n    padding-left: 76px;\n  }\n  :root[data-time-style=\"journal\"] .tl-row::before {\n    content: '';\n    position: absolute;\n    left: 54px;\n    top: 6px;\n    bottom: -12px;\n    width: 1px;\n    background: var(--line);\n  }\n  :root[data-time-style=\"journal\"] .tl-side {\n    position: absolute;\n    left: 0;\n    top: 12px;\n    width: 50px;\n    display: flex;\n    flex-direction: column;\n    align-items: flex-end;\n    line-height: 1;\n  }\n  :root[data-time-style=\"journal\"] .tl-month {\n    font-size: 10px;\n    font-weight: 700;\n    letter-spacing: 1.5px;\n    color: var(--text-dim);\n    margin-bottom: 5px;\n  }\n  :root[data-time-style=\"journal\"] .tl-day {\n    font-family: Georgia, \"Times New Roman\", serif;\n    font-size: 31px;\n    font-weight: 700;\n    letter-spacing: -1.5px;\n    color: var(--accent);\n    line-height: .9;\n  }\n  :root[data-time-style=\"journal\"] .tl-side::after {\n    content: '';\n    width: 22px;\n    height: 2px;\n    margin-top: 9px;\n    border-radius: 1px;\n    background: var(--accent);\n    opacity: .3;\n  }\n"

          new = "  /* 手账样式：日期在上，竖线从日期正下方延伸，卡片挂右侧 */\n  :root[data-time-style=\"journal\"] .tl-row {\n    position: relative;\n  }\n  :root[data-time-style=\"journal\"] .tl-row::before {\n    content: '';\n    position: absolute;\n    left: 4px;\n    top: 34px;\n    bottom: 0;\n    width: 1px;\n    background: var(--line);\n  }\n  :root[data-time-style=\"journal\"] .tl-side {\n    display: flex;\n    align-items: baseline;\n    gap: 7px;\n    margin: 0 0 9px;\n    padding-left: 2px;\n    line-height: 1;\n  }\n  :root[data-time-style=\"journal\"] .tl-month {\n    font-size: 10px;\n    font-weight: 700;\n    letter-spacing: 2.5px;\n    color: var(--text-dim);\n  }\n  :root[data-time-style=\"journal\"] .tl-day {\n    font-family: Georgia, \"Times New Roman\", serif;\n    font-size: 23px;\n    font-weight: 700;\n    letter-spacing: -.5px;\n    color: var(--accent);\n    line-height: 1;\n  }\n  :root[data-time-style=\"journal\"] .tl-row .card {\n    margin-left: 24px;\n  }\n"

          c = s.count(old)
          print('count=%d want=1' % c)
          if c != 1:
              sys.exit(1)

          s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: journal rail now runs under the date"
          git push origin HEAD:main
      - name: Cleanup
        run: |
          git rm -f exact.txt fulldump.txt 2>/dev/null || true
          git rm .github/workflows/rail-under-date.yml
          git commit -m "chore: cleanup dumps and rail workflow"
          git push origin HEAD:main
