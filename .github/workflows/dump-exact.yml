name: dump-exact

on:
  push:
    paths:
      - '.github/workflows/dump-exact.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump exact journal css and render template
        run: |
          {
            echo "########## journal CSS 完整（316-400） ##########"
            awk 'NR>=316 && NR<=400 {printf "%d| %s\n", NR, $0}' index.html
            echo ""
            echo "########## render 模板 2500-2570 ##########"
            awk 'NR>=2500 && NR<=2570 {printf "%d| %s\n", NR, $0}' index.html
          } > exact.txt
          wc -l exact.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exact.txt
          git commit -m "chore: dump exact journal css"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/dump-exact.yml
          git commit -m "chore: remove dump-exact workflow"
          git push origin HEAD:main
