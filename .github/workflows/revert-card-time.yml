name: revert-card-time

on:
  push:
    paths:
      - '.github/workflows/revert-card-time.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move date back outside and add a group marker
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          old_tpl = "        <div class=\"card\" data-id=\"${r.id}\">\n          ${startDisplay ? `<div class=\"card-time\">${startDisplay}</div>` : ''}\n          <div class=\"card-layout\">\n"
          new_tpl = "        ${startDisplay ? `<div class=\"card-time\">${startDisplay}</div>` : ''}\n        <div class=\"card\" data-id=\"${r.id}\">\n          <div class=\"card-layout\">\n"

          c1 = s.count(old_tpl)
          print('tpl count=%d want=1' % c1)
          if c1 != 1:
              sys.exit(1)
          s = s.replace(old_tpl, new_tpl)

          old_css = "  .card-time {\n    font-size: calc(11.5px * var(--fs));\n    color: var(--text-dim);\n    margin: 0 0 10px;\n    letter-spacing: .3px;\n  }\n"
          new_css = "  .card-time {\n    font-size: calc(12px * var(--fs));\n    color: var(--text-dim);\n    margin: 14px 0 7px 4px;\n    letter-spacing: .3px;\n    padding-left: 9px;\n    position: relative;\n  }\n  .card-time::before {\n    content: '';\n    position: absolute;\n    left: 0;\n    top: 50%;\n    transform: translateY(-50%);\n    width: 3px;\n    height: 11px;\n    border-radius: 2px;\n    background: var(--accent);\n    opacity: .5;\n  }\n"

          c2 = s.count(old_css)
          print('css count=%d want=1' % c2)
          if c2 != 1:
              sys.exit(1)
          s = s.replace(old_css, new_css)

          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "style: date back outside card with a group marker"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/revert-card-time.yml
          git commit -m "chore: remove revert-card-time workflow"
          git push origin HEAD:main
