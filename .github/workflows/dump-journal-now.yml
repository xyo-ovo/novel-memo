name: dump-journal-now

on:
  push:
    paths:
      - '.github/workflows/dump-journal-now.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump current journal css
        run: |
          {
            echo "=== CSS 308-380 ==="
            awk 'NR>=308 && NR<=380 {printf "%d|%s\n", NR, $0}' index.html
            echo ""
            echo "=== #list 245-256 ==="
            awk 'NR>=245 && NR<=256 {printf "%d|%s\n", NR, $0}' index.html
            echo ""
            echo "=== loadSettings 1735-1752 ==="
            awk 'NR>=1735 && NR<=1752 {printf "%d|%s\n", NR, $0}' index.html
            echo ""
            echo "=== render 模板 tl-row ==="
            grep -n "tl-row\|tl-side\|tl-year\|journalHead" index.html
          } > k.txt
          wc -l k.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k.txt
          git commit -m "chore: dump current journal state"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/dump-journal-now.yml
          git commit -m "chore: remove dump workflow"
          git push origin HEAD:main
