name: desc-tie-flip

on:
  push:
    paths:
      - '.github/workflows/desc-tie-flip.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flip descending tie-break direction
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          old = "  function compareByTimeDesc(a, b) {\n    const at = readSortKey(a);\n    const bt = readSortKey(b);\n    if (at !== bt) return at > bt ? -1 : 1;\n    const as = tieStartKey(a);\n    const bs = tieStartKey(b);\n    if (as === bs) return 0;\n    return as < bs ? -1 : 1;\n  }\n"

          new = "  function compareByTimeDesc(a, b) {\n    const at = readSortKey(a);\n    const bt = readSortKey(b);\n    if (at !== bt) return at > bt ? -1 : 1;\n    // 同一天读完时，跟主方向一致：开始晚的在前\n    const as = tieStartKey(a);\n    const bs = tieStartKey(b);\n    if (as === bs) return 0;\n    return as > bs ? -1 : 1;\n  }\n"

          c = s.count(old)
          print('count=%d want=1' % c)
          if c != 1:
              sys.exit(1)

          s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: descending tie-break now follows the descending direction"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/desc-tie-flip.yml
          git commit -m "chore: remove desc-tie-flip workflow"
          git push origin HEAD:main
