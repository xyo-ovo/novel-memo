name: covers-hscroll

on:
  push:
    paths:
      - '.github/workflows/covers-hscroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme covers scroll horizontally
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          old = "  .theme-covers { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }\n"
          new = "  .theme-covers { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }\n  .theme-covers::-webkit-scrollbar { display: none; }\n"

          c = s.count(old)
          print('count=%d want=1' % c)
          if c != 1:
              sys.exit(1)

          s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "style: theme covers scroll horizontally to keep dialog short"
          git push origin HEAD:main
      - name: Remove workflow
        run: |
          git rm .github/workflows/covers-hscroll.yml
          git commit -m "chore: remove covers hscroll workflow"
          git push origin HEAD:main
