name: one-shot-sort-grid-patch

on:
  push:
    paths:
      - '.github/workflows/one-shot-sort-grid-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sort menu two columns with divider
        run: |
          python3 - <<'PY'
          import io, sys

          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          n = len(s)

          old = "  .sort-menu {\n    position: absolute;\n    right: 0;\n    top: calc(100% + 6px);\n    min-width: 190px;\n    background: var(--sheet-glass);\n    border: 1px solid var(--card-border);\n    border-radius: 14px;\n    box-shadow: 0 12px 34px rgba(30,40,50,.18);\n    padding: 6px;\n    display: none;\n    z-index: 40;\n    max-height: 62vh;\n    overflow-y: auto;\n  }\n  .sort-menu.show { display: block; }\n"

          new = "  .sort-menu {\n    position: absolute;\n    right: 0;\n    top: calc(100% + 6px);\n    width: min(94vw, 400px);\n    background: var(--sheet-glass);\n    border: 1px solid var(--card-border);\n    border-radius: 14px;\n    box-shadow: 0 12px 34px rgba(30,40,50,.18);\n    padding: 6px;\n    display: none;\n    z-index: 40;\n    max-height: 62vh;\n    overflow-y: auto;\n  }\n  .sort-menu.show {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    column-gap: 8px;\n  }\n  .sort-menu.show::before {\n    content: '';\n    position: absolute;\n    left: 50%;\n    top: 12px;\n    bottom: 12px;\n    width: 1px;\n    background: var(--line);\n    pointer-events: none;\n  }\n"

          c = s.count(old)
          print('count=%d want=1' % c)
          if c != 1:
              sys.exit(1)

          s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('DONE %d -> %d bytes' % (n, len(s)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "style: sort menu as two columns with center divider"
          git push origin HEAD:main
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-sort-grid-patch.yml
          git commit -m "chore: remove one-shot sort grid workflow"
          git push origin HEAD:main
